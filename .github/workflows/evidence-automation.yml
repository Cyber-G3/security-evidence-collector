name: Security Evidence Automation

on:
  workflow_dispatch:
  schedule:
    - cron: "17 6 * * 1"

permissions:
  contents: read

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install project
        run: python -m pip install -e .

      - name: Collect evidence
        run: sec-evidence collect github "${{ github.repository }}" --output ./evidence-output
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify generated evidence pack
        shell: bash
        run: |
          pack="$(find ./evidence-output -maxdepth 1 -type d -name 'evidence-pack-*' | head -n 1)"
          if [ -z "$pack" ]; then
            echo "No evidence pack was generated."
            exit 1
          fi
          sec-evidence verify "$pack"

      - name: Upload evidence artifact
        uses: actions/upload-artifact@v4
        with:
          name: security-evidence-${{ github.run_id }}
          path: evidence-output/evidence-pack-*/
          if-no-files-found: error
          retention-days: 30
