name: Security Evidence Automation

on:
  workflow_dispatch:
  schedule:
    - cron: "17 6 * * 1"

permissions:
  contents: read

jobs:
  collect-evidence:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: python -m pip install -e .

      - name: Collect evidence
        run: sec-evidence collect github "${{ github.repository }}" --output ./evidence
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve evidence pack
        id: pack
        shell: bash
        run: |
          set -euo pipefail
          pack="$(find ./evidence -maxdepth 1 -type d -name 'evidence-pack-*' -print -quit)"
          test -n "$pack"
          echo "path=$pack" >> "$GITHUB_OUTPUT"

      - name: Verify evidence integrity
        run: sec-evidence verify "${{ steps.pack.outputs.path }}"

      - name: Upload evidence artifact
        uses: actions/upload-artifact@v4
        with:
          name: security-evidence-${{ github.run_id }}
          path: ${{ steps.pack.outputs.path }}
          if-no-files-found: error
          retention-days: 30
