[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "security-evidence-collector"
version = "0.1.0.dev0"
description = "Deterministic security evidence collection and control-mapping toolkit"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Apache-2.0" }
dependencies = [
  "httpx>=0.27,<1",
  "pydantic>=2.8,<3",
  "typer>=0.12,<1",
  "PyYAML>=6.0,<7",
]

[project.optional-dependencies]
dev = [
  "pytest>=9.0.3,<10",
  "pytest-cov>=5,<8",
  "respx>=0.21,<1",
  "ruff>=0.6,<1",
  "mypy>=1.11,<2",
  "types-PyYAML>=6.0,<7",
  "bandit>=1.7,<2",
  "pip-audit>=2.7,<3",
]

[project.scripts]
sec-evidence = "sec_evidence.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
sec_evidence = ["data/*.yaml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = [
  "B008",  # Typer intentionally declares Argument/Option metadata in function defaults.
  "E501",  # Formatting/readability is handled independently of hard line-length lint failures.
  "UP017", # timezone.utc remains explicit and supported on Python 3.12+.
]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["sec_evidence"]

[tool.coverage.run]
source = ["sec_evidence"]
branch = true
